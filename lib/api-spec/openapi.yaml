openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FootballLive API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: matches
    description: Match operations
  - name: teams
    description: Team operations
  - name: streams
    description: Stream operations
  - name: highlights
    description: Highlight operations
  - name: stats
    description: Stats and summary operations
  - name: tournaments
    description: Tournament operations
  - name: events
    description: Match event operations
  - name: lineup
    description: Match lineup operations
  - name: admin
    description: Admin auth operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthStatus"
        "401":
          description: Invalid credentials

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthStatus"

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Get admin auth status
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthStatus"

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams
      parameters:
        - name: sport
          in: query
          schema:
            type: string
            enum: [football, futsal, all]
      responses:
        "200":
          description: Teams list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /teams/{id}/squad:
    get:
      operationId: getTeamSquad
      tags: [teams]
      summary: Get a team's squad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Squad list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SquadPlayer"
    post:
      operationId: addSquadPlayer
      tags: [teams]
      summary: Add a player to a team's squad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SquadPlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquadPlayer"

  /teams/{id}/squad/{playerId}:
    patch:
      operationId: updateSquadPlayer
      tags: [teams]
      summary: Update a squad player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SquadPlayerInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquadPlayer"
    delete:
      operationId: removeSquadPlayer
      tags: [teams]
      summary: Remove a player from squad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /matches/{id}/lineup/auto:
    post:
      operationId: autoFillLineup
      tags: [lineup]
      summary: Auto-fill match lineup from both teams' squads
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lineup auto-filled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLineup"

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List all tournaments
      parameters:
        - name: sport
          in: query
          schema:
            type: string
            enum: [football, futsal, all]
      responses:
        "200":
          description: Tournaments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tournament"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create a tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      summary: Get a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
    patch:
      operationId: updateTournament
      tags: [tournaments]
      summary: Update a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
    delete:
      operationId: deleteTournament
      tags: [tournaments]
      summary: Delete a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tournaments/active:
    get:
      operationId: listActiveTournaments
      tags: [tournaments]
      summary: List tournaments with match activity status
      parameters:
        - name: sport
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Active tournaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentWithStatus"

  /tournaments/{id}/matches:
    get:
      operationId: getTournamentMatches
      tags: [tournaments]
      summary: Get all matches for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /tournaments/{id}/standings:
    get:
      operationId: getTournamentStandings
      tags: [tournaments]
      summary: Get tournament standings (grouped by group for group-stage format)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStandings"

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List all matches
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [live, scheduled, finished, all]
        - name: competition
          in: query
          schema:
            type: string
        - name: sport
          in: query
          schema:
            type: string
            enum: [football, futsal, all]
        - name: tournamentId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Create a new match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/live:
    get:
      operationId: listLiveMatches
      tags: [matches]
      summary: List currently live matches
      parameters:
        - name: sport
          in: query
          schema:
            type: string
            enum: [football, futsal, all]
      responses:
        "200":
          description: Live matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get a single match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          description: Not found
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    delete:
      operationId: deleteMatch
      tags: [matches]
      summary: Delete a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /matches/{id}/events:
    get:
      operationId: listMatchEvents
      tags: [events]
      summary: Get all events for a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchEvent"
    post:
      operationId: createMatchEvent
      tags: [events]
      summary: Add a match event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchEvent"

  /matches/{id}/events/{eventId}:
    patch:
      operationId: updateMatchEvent
      tags: [events]
      summary: Update a match event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchEventInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchEvent"
    delete:
      operationId: deleteMatchEvent
      tags: [events]
      summary: Delete a match event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /matches/{id}/lineup:
    get:
      operationId: getMatchLineup
      tags: [lineup]
      summary: Get match lineup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lineup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLineup"
    post:
      operationId: addLineupPlayer
      tags: [lineup]
      summary: Add a player to the lineup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupPlayerInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupPlayer"

  /matches/{id}/lineup/{playerId}:
    delete:
      operationId: removeLineupPlayer
      tags: [lineup]
      summary: Remove a player from lineup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /streams:
    get:
      operationId: listStreams
      tags: [streams]
      summary: List available streams
      parameters:
        - name: matchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Streams list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stream"
    post:
      operationId: createStream
      tags: [streams]
      summary: Create a stream link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"

  /streams/{id}:
    delete:
      operationId: deleteStream
      tags: [streams]
      summary: Delete a stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /highlights:
    get:
      operationId: listHighlights
      tags: [highlights]
      summary: List all highlights
      parameters:
        - name: competition
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Highlights list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Highlight"
    post:
      operationId: createHighlight
      tags: [highlights]
      summary: Create a highlight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HighlightInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlight"

  /highlights/{id}:
    get:
      operationId: getHighlight
      tags: [highlights]
      summary: Get a single highlight
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Highlight found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlight"
    delete:
      operationId: deleteHighlight
      tags: [highlights]
      summary: Delete a highlight
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get dashboard stats summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/competitions:
    get:
      operationId: listCompetitions
      tags: [stats]
      summary: List active competitions
      responses:
        "200":
          description: Competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitionStat"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminAuthStatus:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean

    Team:
      type: object
      required: [id, name, shortName, logoUrl, country, sport]
      properties:
        id:
          type: integer
        name:
          type: string
        shortName:
          type: string
        logoUrl:
          type: string
        country:
          type: string
        sport:
          type: string
          enum: [football, futsal]

    TeamInput:
      type: object
      required: [name, shortName, country, sport]
      properties:
        name:
          type: string
        shortName:
          type: string
        logoUrl:
          type: string
        country:
          type: string
        sport:
          type: string
          enum: [football, futsal]

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        shortName:
          type: string
        logoUrl:
          type: string
        country:
          type: string
        sport:
          type: string
          enum: [football, futsal]

    Tournament:
      type: object
      required: [id, name, sport, season, active, format]
      properties:
        id:
          type: integer
        name:
          type: string
        sport:
          type: string
          enum: [football, futsal]
        season:
          type: string
        logoUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        active:
          type: boolean
        format:
          type: string
          enum: [league, group_stage, knockout]

    TournamentWithStatus:
      type: object
      required: [id, name, sport, season, active, format, matchStatus, matchCount]
      properties:
        id:
          type: integer
        name:
          type: string
        sport:
          type: string
          enum: [football, futsal]
        season:
          type: string
        logoUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        active:
          type: boolean
        format:
          type: string
          enum: [league, group_stage, knockout]
        matchStatus:
          type: string
          enum: [live, ongoing, upcoming, finished]
        matchCount:
          type: integer
        liveCount:
          type: integer

    TournamentInput:
      type: object
      required: [name, sport, season]
      properties:
        name:
          type: string
        sport:
          type: string
          enum: [football, futsal]
        season:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        format:
          type: string
          enum: [league, group_stage, knockout]

    TournamentUpdate:
      type: object
      properties:
        name:
          type: string
        sport:
          type: string
          enum: [football, futsal]
        season:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        active:
          type: boolean
        format:
          type: string
          enum: [league, group_stage, knockout]

    TournamentStandings:
      type: object
      required: [format, groups]
      properties:
        format:
          type: string
          enum: [league, group_stage, knockout]
        groups:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/StandingRow"

    StandingRow:
      type: object
      required: [position, team, played, won, drawn, lost, goalsFor, goalsAgainst, goalDifference, points, formGuide]
      properties:
        position:
          type: integer
        team:
          $ref: "#/components/schemas/Team"
        played:
          type: integer
        won:
          type: integer
        drawn:
          type: integer
        lost:
          type: integer
        goalsFor:
          type: integer
        goalsAgainst:
          type: integer
        goalDifference:
          type: integer
        points:
          type: integer
        formGuide:
          type: array
          items:
            type: string
            enum: [W, D, L]

    Match:
      type: object
      required: [id, homeTeam, awayTeam, homeScore, awayScore, status, minute, competition, kickoffAt, streamCount, sport]
      properties:
        id:
          type: integer
        homeTeam:
          $ref: "#/components/schemas/Team"
        awayTeam:
          $ref: "#/components/schemas/Team"
        homeScore:
          type: integer
        awayScore:
          type: integer
        status:
          type: string
          enum: [live, scheduled, finished, postponed]
        minute:
          type: ["string", "null"]
        competition:
          type: string
        competitionLogo:
          type: ["string", "null"]
        kickoffAt:
          type: string
          format: date-time
        streamCount:
          type: integer
        featured:
          type: boolean
        sport:
          type: string
          enum: [football, futsal]
        tournamentId:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        matchGroup:
          type: ["string", "null"]

    MatchDetail:
      type: object
      required: [id, homeTeam, awayTeam, homeScore, awayScore, status, minute, competition, kickoffAt, streams, events, sport]
      properties:
        id:
          type: integer
        homeTeam:
          $ref: "#/components/schemas/Team"
        awayTeam:
          $ref: "#/components/schemas/Team"
        homeScore:
          type: integer
        awayScore:
          type: integer
        status:
          type: string
          enum: [live, scheduled, finished, postponed]
        minute:
          type: ["string", "null"]
        competition:
          type: string
        competitionLogo:
          type: ["string", "null"]
        kickoffAt:
          type: string
          format: date-time
        streamCount:
          type: integer
        featured:
          type: boolean
        sport:
          type: string
          enum: [football, futsal]
        tournamentId:
          type: ["integer", "null"]
        venue:
          type: ["string", "null"]
        matchGroup:
          type: ["string", "null"]
        streams:
          type: array
          items:
            $ref: "#/components/schemas/Stream"
        events:
          type: array
          items:
            $ref: "#/components/schemas/MatchEvent"

